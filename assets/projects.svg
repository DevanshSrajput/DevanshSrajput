<svg viewBox="0 0 920 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="400" style="background:#07090e;border-radius:10px;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700;800&amp;display=swap');
      .title { font-family: 'Space Grotesk', -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; fill: #94a3b8; }
      .desc { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #94a3b8; line-height: 1.5; }
      .pill-text { font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 600; text-anchor: middle; }
      .card-bg { fill: #0b1120; fill-opacity: 0.5; stroke: #1e293b; stroke-width: 1; rx: 6px; }
    </style>

    <linearGradient id="p-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="proj-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.5" fill="#1e293b" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Frame Background -->
  <rect width="920" height="400" fill="#07090e" rx="10"/>
  <rect width="920" height="400" fill="url(#proj-grid)" rx="10"/>
  <rect width="918" height="398" x="1" y="1" fill="none" stroke="#172238" stroke-width="1" rx="10"/>

  <!-- Minimal Header -->
  <g transform="translate(24, 20)">
    <text x="0" y="14" class="title" font-size="12" font-weight="800" fill="#f8fafc" letter-spacing="1">FEATURED ARCHITECTURES &amp; SYSTEMS</text>
    <text x="320" y="14" class="mono" fill="#475569">|</text>
    <text x="335" y="14" class="mono" fill="#64748b">// 4 CORE REPOSITORIES WITH EVIDENCE</text>

    <!-- Count Pill -->
    <rect x="760" y="0" width="112" height="20" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="816" y="13" text-anchor="middle" class="mono" font-size="8" font-weight="700" fill="#38bdf8">4 KEY REPOSITORIES</text>
  </g>
  <line x1="24" y1="46" x2="896" y2="46" stroke="#151f33" stroke-width="1"/>

  <!-- ==================== 2x2 MINIMAL PROJECTS GRID ==================== -->

  <!-- PROJECT 1: Olist Delivery Analysis -->
  <g transform="translate(24, 60)">
    <rect width="426" height="150" class="card-bg"/>
    <rect width="4" height="150" rx="1" fill="#00f0ff"/>

    <!-- Title & Badge -->
    <text x="18" y="24" class="title">olist-delivery-analysis</text>
    <rect x="280" y="10" width="130" height="18" rx="3" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="345" y="22" text-anchor="middle" class="mono" font-size="7.5" font-weight="700" fill="#00f0ff">BI &amp; DATA ENGINE</text>

    <!-- Description -->
    <text x="18" y="50" class="desc">Production case study of 96,470 Brazilian e-commerce orders.</text>
    <text x="18" y="66" class="desc">Engineered OLAP aggregations isolating delivery delay bottlenecks</text>
    <text x="18" y="82" class="desc">vs review scores with an interactive Tableau Public dashboard.</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(18, 108)">
      <rect x="0" y="0" width="65" height="20" rx="3" fill="#0f172a" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="32" y="13" class="pill-text" fill="#00f0ff">DuckDB</text>

      <rect x="73" y="0" width="75" height="20" rx="3" fill="#0f172a" stroke="#ffb703" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="110" y="13" class="pill-text" fill="#ffb703">Tableau</text>

      <rect x="156" y="0" width="60" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="186" y="13" class="pill-text" fill="#38bdf8">Python</text>

      <rect x="224" y="0" width="45" height="20" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.3"/>
      <text x="246" y="13" class="pill-text" fill="#94a3b8">SQL</text>

      <!-- Scope Tag -->
      <text x="390" y="13" text-anchor="end" class="mono" font-size="8" fill="#00f5d4">96.4K ORDERS</text>
    </g>
  </g>

  <!-- PROJECT 2: Dataa_Analyst_Agent -->
  <g transform="translate(470, 60)">
    <rect width="426" height="150" class="card-bg"/>
    <rect width="4" height="150" rx="1" fill="#00f5d4"/>

    <!-- Title & Badge -->
    <text x="18" y="24" class="title">Dataa_Analyst_Agent</text>
    <rect x="290" y="10" width="120" height="18" rx="3" fill="#00f5d4" fill-opacity="0.08" stroke="#00f5d4" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="350" y="22" text-anchor="middle" class="mono" font-size="7.5" font-weight="700" fill="#00f5d4">&#9733; 23 STARS</text>

    <!-- Description -->
    <text x="18" y="50" class="desc">Multi-agent autonomous framework for exploratory data analysis.</text>
    <text x="18" y="66" class="desc">Executes automated statistical tests, dynamic anomaly detection,</text>
    <text x="18" y="82" class="desc">and automated chart generation directly from raw CSV/SQL tables.</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(18, 108)">
      <rect x="0" y="0" width="60" height="20" rx="3" fill="#0f172a" stroke="#00f5d4" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="30" y="13" class="pill-text" fill="#00f5d4">Python</text>

      <rect x="68" y="0" width="80" height="20" rx="3" fill="#0f172a" stroke="#a78bfa" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="108" y="13" class="pill-text" fill="#a78bfa">LangGraph</text>

      <rect x="156" y="0" width="55" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="183" y="13" class="pill-text" fill="#38bdf8">LLMs</text>

      <rect x="219" y="0" width="70" height="20" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.3"/>
      <text x="254" y="13" class="pill-text" fill="#94a3b8">Auto-EDA</text>

      <text x="390" y="13" text-anchor="end" class="mono" font-size="8" fill="#00f5d4">AGENTIC</text>
    </g>
  </g>

  <!-- PROJECT 3: SignalHire -->
  <g transform="translate(24, 226)">
    <rect width="426" height="150" class="card-bg"/>
    <rect width="4" height="150" rx="1" fill="#ffb703"/>

    <!-- Title & Badge -->
    <text x="18" y="24" class="title">SignalHire</text>
    <rect x="270" y="10" width="140" height="18" rx="3" fill="#ffb703" fill-opacity="0.08" stroke="#ffb703" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="340" y="22" text-anchor="middle" class="mono" font-size="7.5" font-weight="700" fill="#ffb703">TALENT PIPELINE</text>

    <!-- Description -->
    <text x="18" y="50" class="desc">Automated candidate sourcing and recruitment ingestion pipeline.</text>
    <text x="18" y="66" class="desc">Extracts talent signals, skill topologies, and real-time contact</text>
    <text x="18" y="82" class="desc">metadata across platforms with robust error recovery &amp; rate limits.</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(18, 108)">
      <rect x="0" y="0" width="60" height="20" rx="3" fill="#0f172a" stroke="#ffb703" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="30" y="13" class="pill-text" fill="#ffb703">Python</text>

      <rect x="68" y="0" width="85" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="110" y="13" class="pill-text" fill="#38bdf8">Web Scraping</text>

      <rect x="161" y="0" width="80" height="20" rx="3" fill="#0f172a" stroke="#00f5d4" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="201" y="13" class="pill-text" fill="#00f5d4">Automation</text>

      <rect x="249" y="0" width="45" height="20" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.3"/>
      <text x="271" y="13" class="pill-text" fill="#94a3b8">ETL</text>

      <text x="390" y="13" text-anchor="end" class="mono" font-size="8" fill="#ffb703">PIPELINE</text>
    </g>
  </g>

  <!-- PROJECT 4: Learning-Agent-System -->
  <g transform="translate(470, 226)">
    <rect width="426" height="150" class="card-bg"/>
    <rect width="4" height="150" rx="1" fill="#a78bfa"/>

    <!-- Title & Badge -->
    <text x="18" y="24" class="title">Learning-Agent-System</text>
    <rect x="270" y="10" width="140" height="18" rx="3" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="340" y="22" text-anchor="middle" class="mono" font-size="7.5" font-weight="700" fill="#a78bfa">REINFORCEMENT RL</text>

    <!-- Description -->
    <text x="18" y="50" class="desc">Adaptive multi-agent reinforcement learning architecture.</text>
    <text x="18" y="66" class="desc">Implements dynamic policy iteration, memory retrieval loops,</text>
    <text x="18" y="82" class="desc">and decentralized autonomous agent decision execution.</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(18, 108)">
      <rect x="0" y="0" width="60" height="20" rx="3" fill="#0f172a" stroke="#a78bfa" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="30" y="13" class="pill-text" fill="#a78bfa">PyTorch</text>

      <rect x="68" y="0" width="60" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="98" y="13" class="pill-text" fill="#38bdf8">Python</text>

      <rect x="136" y="0" width="55" height="20" rx="3" fill="#0f172a" stroke="#ffb703" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="163" y="13" class="pill-text" fill="#ffb703">RL</text>

      <rect x="199" y="0" width="60" height="20" rx="3" fill="#0f172a" stroke="#00f5d4" stroke-width="0.75" stroke-opacity="0.5"/>
      <text x="229" y="13" class="pill-text" fill="#00f5d4">Agents</text>

      <text x="390" y="13" text-anchor="end" class="mono" font-size="8" fill="#a78bfa">ADAPTIVE</text>
    </g>
  </g>
</svg>