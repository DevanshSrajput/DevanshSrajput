    </circle>
    <text x="16" y="9" class="mono" font-size="9" font-weight="600" fill="#00f5d4" letter-spacing="1">SYSTEM: OPERATIONAL</text>
    <text x="175" y="9" class="mono" font-size="9" fill="#475569">|</text>
    <text x="190" y="9" class="mono" font-size="9" fill="#94a3b8" letter-spacing="0.5">CALLSIGN: <tspan fill="#e2e8f0" font-weight="600">DSR-2027</tspan></text>
    <text x="330" y="9" class="mono" font-size="9" fill="#475569">|</text>
    <text x="345" y="9" class="mono" font-size="9" fill="#94a3b8" letter-spacing="0.5">LOCATION: <tspan fill="#e2e8f0" font-weight="600">SRM-IST // EX-RESEARCH INTERN @ IIT(ISM)</tspan></text>

    <!-- Right-aligned Latency Pill -->
    <rect x="740" y="-4" width="120" height="18" rx="9" fill="#131c2e" stroke="#1e2d4a" stroke-width="1"/>
    <circle cx="752" cy="5" r="3" fill="#ffb703">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="762" y="8" class="mono" font-size="8.5" font-weight="600" fill="#ffb703">EDGE: 0.14ms</text>
  </g>
  <line x1="30" y1="38" x2="890" y2="38" stroke="#172238" stroke-width="1"/>

  <!-- ==================== ZONE 1: LEFT OPERATOR HUD (x=35..210) ==================== -->
  <g transform="translate(35, 60)">
