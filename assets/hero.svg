<svg viewBox="0 0 920 360" xmlns="http://www.w3.org/2000/svg" width="100%" height="360" style="background:#07090e;border-radius:12px;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&amp;family=Space+Grotesk:wght@500;700;800&amp;display=swap');
      .title { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; font-weight: 800; letter-spacing: -0.5px; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
      .sans { font-family: 'Space Grotesk', system-ui, sans-serif; }
    </style>

    <!-- Deep Space Background Gradient -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070b"/>
      <stop offset="50%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Animated Chromatic Title Gradient -->
    <linearGradient id="neon-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#ffb703;#9d4edd;#00f0ff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#ff0055;#00f5d4;#ffffff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffb703">
        <animate attributeName="stop-color" values="#ffb703;#00f0ff;#ff0055;#ffb703" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Ambient Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#131c2e" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="30" cy="30" r="0.75" fill="#1e2d4a"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 3D Globe Radial Gradients & Clip -->
    <radialGradient id="globe-shading" cx="32%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#040812" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="globe-space" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="65%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>
    <clipPath id="hero-globe-clip">
      <circle cx="0" cy="0" r="36"/>
    </clipPath>
