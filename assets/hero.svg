            <path d="M52,-24 Q66,-22 64,-12 Q72,-2 70,12 Q65,24 56,26 Q50,18 50,6 Q46,-6 48,-18 Z" fill="#ffb703" fill-opacity="0.18" stroke="#ffb703" stroke-width="0.8"/>
