  <!-- 1. Background Frame -->
  <rect width="920" height="360" fill="url(#cyber-bg)" rx="12"/>
  <rect width="920" height="360" fill="url(#grid)" rx="12" opacity="0.85"/>

  <!-- Cyber Outer Border & Corner Accents -->
  <rect width="918" height="358" x="1" y="1" fill="none" stroke="#172238" stroke-width="1.5" rx="12"/>
  <path d="M 2 24 L 2 2 L 24 2" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.8"/>
  <path d="M 918 24 L 918 2 L 896 2" fill="none" stroke="#ffb703" stroke-width="2.5" opacity="0.8"/>
  <path d="M 2 336 L 2 358 L 24 358" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.8"/>
  <path d="M 918 336 L 918 358 L 896 358" fill="none" stroke="#ffb703" stroke-width="2.5" opacity="0.8"/>

  <!-- Horizontal Scan Laser -->
