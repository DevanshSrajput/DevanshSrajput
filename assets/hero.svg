          <ellipse cx="0" cy="-11" rx="34" ry="7.5" fill="none" stroke="#1d3554" stroke-width="0.75"/>
          <ellipse cx="0" cy="0" rx="36" ry="8.5" fill="none" stroke="#00f0ff" stroke-width="1.1" stroke-opacity="0.7"/>
