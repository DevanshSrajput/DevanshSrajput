          <g>
            <animateTransform attributeName="transform" type="translate" from="0,0" to="-120,0" dur="8s" repeatCount="indefinite"/>

            <!-- Longitudinal Meridians (Tiles spanning -120 to +240) -->
            <path d="M-120,-36 Q-126,0 -120,36 M-90,-36 Q-96,0 -90,36 M-60,-36 Q-66,0 -60,36 M-30,-36 Q-36,0 -30,36 M0,-36 Q-6,0 0,36 M30,-36 Q24,0 30,36 M60,-36 Q54,0 60,36 M90,-36 Q84,0 90,36 M120,-36 Q114,0 120,36 M150,-36 Q144,0 150,36 M180,-36 Q174,0 180,36 M210,-36 Q204,0 210,36 M240,-36 Q234,0 240,36" fill="none" stroke="#162e4a" stroke-width="0.75" stroke-dasharray="2 2"/>

            <!-- Tile Left (-120..0) -->
            <path d="M-105,-24 Q-98,-20 -100,-12 Q-95,-4 -102,4 Q-106,14 -103,24 Q-109,26 -112,18 Q-110,4 -114,-4 Q-116,-12 -110,-24 Z" fill="#00f0ff" fill-opacity="0.18" stroke="#00f0ff" stroke-width="0.8"/>
            <path d="M-68,-24 Q-54,-22 -56,-12 Q-48,-2 -50,12 Q-55,24 -64,26 Q-70,18 -70,6 Q-74,-6 -72,-18 Z" fill="#ffb703" fill-opacity="0.18" stroke="#ffb703" stroke-width="0.8"/>
            <path d="M-35,-22 Q-18,-20 -14,-10 Q-8,4 -16,14 Q-24,24 -28,18 Q-34,10 -32,-2 Q-40,-8 -38,-20 Z" fill="#00f5d4" fill-opacity="0.18" stroke="#00f5d4" stroke-width="0.8"/>
