      <circle cx="0" cy="0" r="36" fill="url(#globe-shading)" pointer-events="none"/>

      <!-- Holographic Axis Markers -->
      <line x1="0" y1="-41" x2="0" y2="41" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.4" transform="rotate(-15)"/>
      <circle cx="0" cy="-38" r="1.5" fill="#00f0ff" transform="rotate(-15)"/>
      <circle cx="0" cy="38" r="1.5" fill="#00f0ff" transform="rotate(-15)"/>

