<svg viewBox="0 0 920 290" xmlns="http://www.w3.org/2000/svg" width="100%" height="290" style="background:#07090e;border-radius:10px;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;family=Space+Grotesk:wght@600;700;800&amp;display=swap');
      .title { font-family: 'Space Grotesk', -apple-system, system-ui, sans-serif; font-weight: 800; letter-spacing: -0.5px; }
      .mono { font-family: 'JetBrains Mono', monospace, ui-monospace; }
      .sans { font-family: 'Space Grotesk', sans-serif; }
    </style>

    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070b"/>
      <stop offset="50%" stop-color="#080d16"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#131c2e" stroke-width="0.6" stroke-opacity="0.4"/>
      <circle cx="28" cy="28" r="0.6" fill="#1e2d4a" opacity="0.5"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="globe-shading" cx="30%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#040812" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="0.95"/>
    </radialGradient>

    <radialGradient id="globe-space" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="65%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>

    <clipPath id="hero-globe-clip">
      <circle cx="0" cy="0" r="42"/>
    </clipPath>
  </defs>

  <!-- Background Frame -->
  <rect width="920" height="290" fill="url(#cyber-bg)" rx="10"/>
  <rect width="920" height="290" fill="url(#grid)" rx="10"/>
  <rect width="918" height="288" x="1" y="1" fill="none" stroke="#151f33" stroke-width="1.5" rx="10"/>

  <!-- Minimal Corner Ticks -->
  <path d="M 1 20 L 1 1 L 20 1" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <path d="M 919 20 L 919 1 L 900 1" fill="none" stroke="#ffb703" stroke-width="2" opacity="0.8"/>
  <path d="M 1 270 L 1 289 L 20 289" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <path d="M 919 270 L 919 289 L 900 289" fill="none" stroke="#ffb703" stroke-width="2" opacity="0.8"/>

  <!-- Top Telemetry Strip -->
  <g transform="translate(30, 24)">
    <circle cx="4" cy="4" r="3.5" fill="#00f5d4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="8" class="mono" font-size="9" font-weight="700" fill="#00f5d4" letter-spacing="1">SYSTEM: OPERATIONAL</text>
    <text x="160" y="8" class="mono" font-size="9" fill="#334155">|</text>
    <text x="175" y="8" class="mono" font-size="9" fill="#94a3b8">CALLSIGN: <tspan fill="#f8fafc" font-weight="700">DSR-2027</tspan></text>
    <text x="300" y="8" class="mono" font-size="9" fill="#334155">|</text>
    <text x="315" y="8" class="mono" font-size="9" fill="#94a3b8">CAMPUS: <tspan fill="#f8fafc" font-weight="600">SRM-IST</tspan> // EX-INTERN @ <tspan fill="#ffb703" font-weight="600">IIT(ISM)</tspan></text>

    <!-- Top Right Portfolio Link -->
    <text x="860" y="8" text-anchor="end" class="mono" font-size="9" font-weight="600" fill="#00f0ff">devanshsingh.dev <tspan fill="#ffb703">&#9658;</tspan></text>
  </g>
  <line x1="30" y1="38" x2="890" y2="38" stroke="#151f33" stroke-width="1"/>

  <!-- LEFT COLUMN: Revolving 3D Globe &amp; Level Milestone -->
  <g transform="translate(118, 126)">
    <!-- Globe Atmosphere Ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#131e33" stroke-width="0.8" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" filter="url(#glow)"/>

    <!-- Deep Spherical Fill -->
    <circle cx="0" cy="0" r="42" fill="url(#globe-space)"/>

    <!-- Revolving Surface Clipped to Sphere -->
    <g clip-path="url(#hero-globe-clip)">
      <g transform="rotate(-15)">
        <g>
          <animateTransform attributeName="transform" type="translate" from="0,0" to="-120,0" dur="8s" repeatCount="indefinite"/>

          <!-- Longitudinal Meridians (Periodic tiling) -->
          <path d="M-120,-42 Q-128,0 -120,42 M-90,-42 Q-98,0 -90,42 M-60,-42 Q-68,0 -60,42 M-30,-42 Q-38,0 -30,42 M0,-42 Q-8,0 0,42 M30,-42 Q22,0 30,42 M60,-42 Q52,0 60,42 M90,-42 Q82,0 90,42 M120,-42 Q112,0 120,42 M150,-42 Q142,0 150,42 M180,-42 Q172,0 180,42 M210,-42 Q202,0 210,42 M240,-42 Q232,0 240,42" fill="none" stroke="#183252" stroke-width="0.75" stroke-dasharray="2 2"/>

          <!-- Tile Left (-120..0) -->
          <path d="M-105,-28 Q-98,-24 -100,-14 Q-95,-5 -102,5 Q-106,16 -103,28 Q-109,30 -112,21 Q-110,5 -114,-5 Q-116,-14 -110,-28 Z" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="0.8"/>
          <path d="M-68,-28 Q-54,-25 -56,-14 Q-48,-2 -50,14 Q-55,28 -64,30 Q-70,21 -70,7 Q-74,-7 -72,-21 Z" fill="#ffb703" fill-opacity="0.2" stroke="#ffb703" stroke-width="0.8"/>
          <path d="M-35,-26 Q-18,-24 -14,-12 Q-8,5 -16,16 Q-24,28 -28,21 Q-34,12 -32,-2 Q-40,-9 -38,-24 Z" fill="#00f5d4" fill-opacity="0.2" stroke="#00f5d4" stroke-width="0.8"/>
          <circle cx="-102" cy="-9" r="1.6" fill="#ffffff"/>
          <circle cx="-62" cy="-16" r="1.6" fill="#ffffff"/>
          <circle cx="-22" cy="-5" r="1.6" fill="#ffffff"/>

          <!-- Tile Center (0..120) -->
          <path d="M15,-28 Q22,-24 20,-14 Q25,-5 18,5 Q14,16 17,28 Q11,30 8,21 Q10,5 6,-5 Q4,-14 10,-28 Z" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="0.8"/>
          <path d="M52,-28 Q66,-25 64,-14 Q72,-2 70,14 Q65,28 56,30 Q50,21 50,7 Q46,-7 48,-21 Z" fill="#ffb703" fill-opacity="0.2" stroke="#ffb703" stroke-width="0.8"/>
          <path d="M85,-26 Q102,-24 106,-12 Q112,5 104,16 Q96,28 92,21 Q86,12 88,-2 Q80,-9 82,-24 Z" fill="#00f5d4" fill-opacity="0.2" stroke="#00f5d4" stroke-width="0.8"/>
          <circle cx="18" cy="-9" r="1.6" fill="#ffffff"/>
          <circle cx="58" cy="-16" r="1.6" fill="#ffffff"/>
          <circle cx="98" cy="-5" r="1.6" fill="#ffffff"/>

          <!-- Tile Right (120..240) -->
          <path d="M135,-28 Q142,-24 140,-14 Q145,-5 138,5 Q134,16 137,28 Q131,30 128,21 Q130,5 126,-5 Q124,-14 130,-28 Z" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="0.8"/>
          <path d="M172,-28 Q186,-25 184,-14 Q192,-2 190,14 Q185,28 176,30 Q170,21 170,7 Q166,-7 168,-21 Z" fill="#ffb703" fill-opacity="0.2" stroke="#ffb703" stroke-width="0.8"/>
          <path d="M205,-26 Q222,-24 226,-12 Q232,5 224,16 Q216,28 212,21 Q206,12 208,-2 Q200,-9 202,-24 Z" fill="#00f5d4" fill-opacity="0.2" stroke="#00f5d4" stroke-width="0.8"/>
          <circle cx="138" cy="-9" r="1.6" fill="#ffffff"/>
          <circle cx="178" cy="-16" r="1.6" fill="#ffffff"/>
          <circle cx="218" cy="-5" r="1.6" fill="#ffffff"/>
        </g>

        <!-- Latitude Parallels -->
        <ellipse cx="0" cy="-26" rx="33" ry="7" fill="none" stroke="#1d324d" stroke-width="0.75" stroke-dasharray="2 2"/>
        <ellipse cx="0" cy="-13" rx="40" ry="8.5" fill="none" stroke="#1d3858" stroke-width="0.75"/>
        <ellipse cx="0" cy="0" rx="42" ry="10" fill="none" stroke="#00f0ff" stroke-width="1.1" stroke-opacity="0.7"/>
        <ellipse cx="0" cy="13" rx="40" ry="8.5" fill="none" stroke="#1d3858" stroke-width="0.75"/>
        <ellipse cx="0" cy="26" rx="33" ry="7" fill="none" stroke="#1d324d" stroke-width="0.75" stroke-dasharray="2 2"/>
      </g>
    </g>

    <!-- 3D Shading Overlay -->
    <circle cx="0" cy="0" r="42" fill="url(#globe-shading)" pointer-events="none"/>

    <!-- Holographic Axis Markers -->
    <line x1="0" y1="-48" x2="0" y2="48" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.4" transform="rotate(-15)"/>
    <circle cx="0" cy="-45" r="1.5" fill="#00f0ff" transform="rotate(-15)"/>
    <circle cx="0" cy="45" r="1.5" fill="#00f0ff" transform="rotate(-15)"/>

    <!-- Revolving Satellite Orbital Ring -->
    <g transform="rotate(-26)">
      <ellipse cx="0" cy="0" rx="54" ry="16" fill="none" stroke="#ffb703" stroke-width="0.9" stroke-dasharray="4 3" stroke-opacity="0.6"/>
      <circle r="3" fill="#ffb703" filter="url(#glow)">
        <animateMotion dur="4.5s" repeatCount="indefinite" path="M -54,0 A 54 16 0 1,1 54,0 A 54 16 0 1,1 -54,0"/>
      </circle>
      <circle r="1.3" fill="#ffffff">
        <animateMotion dur="4.5s" repeatCount="indefinite" path="M -54,0 A 54 16 0 1,1 54,0 A 54 16 0 1,1 -54,0"/>
      </circle>
    </g>
  </g>

  <!-- Level 27 Brutalist Tag below Globe -->
  <g transform="translate(40, 196)">
    <rect width="156" height="24" rx="3" fill="#ffb703" fill-opacity="0.08" stroke="#ffb703" stroke-width="1" stroke-opacity="0.5"/>
    <text x="78" y="16" text-anchor="middle" class="mono" font-size="9" font-weight="700" fill="#ffb703" letter-spacing="1">LEVEL 27 · CLASS OF '27</text>
    <text x="78" y="38" text-anchor="middle" class="mono" font-size="8" fill="#64748b">SRM-IST CSE · CGPA 8.91</text>
  </g>

  <!-- Vertical Subtle Divider -->
  <line x1="235" y1="52" x2="235" y2="265" stroke="#151f33" stroke-width="1"/>

  <!-- RIGHT COLUMN: Minimalist High-Legibility Information -->
  <g transform="translate(265, 52)">
    <!-- Domain Tag -->
    <text x="0" y="16" class="mono" font-size="9" font-weight="700" fill="#00f0ff" letter-spacing="1.5">// MACHINE LEARNING &amp; DATA SYSTEMS ARCHITECT</text>

    <!-- Main Title Name -->
    <text x="0" y="52" class="title" font-size="34" fill="url(#title-grad)">DEVANSH SINGH RAJPUT</text>

    <!-- Role Summary Subtitle -->
    <text x="0" y="74" class="mono" font-size="11" fill="#94a3b8">
      ML Engineer <tspan fill="#ffb703">&#183;</tspan> Applied Researcher <tspan fill="#00f0ff">&#183;</tspan> Ex-Intern @ IIT(ISM) Dhanbad
    </text>

    <!-- Minimalist Latest Dispatch Box -->
    <g transform="translate(0, 92)">
      <rect width="595" height="52" rx="4" fill="#090e18" stroke="#17233a" stroke-width="1"/>
      <rect width="4" height="52" rx="1" fill="#00f0ff"/>

      <text x="16" y="22" class="mono" font-size="9" fill="#64748b">LATEST DISPATCH:</text>
      <text x="128" y="22" class="mono" font-size="10" font-weight="700" fill="#00f5d4">olist-delivery-analysis</text>
      <text x="320" y="22" class="mono" font-size="8.5" fill="#ffb703">[DUCKDB + TABLEAU BI]</text>

      <text x="16" y="40" class="mono" font-size="8.5" fill="#94a3b8">Analyzed 96,470 orders &#183; Delay bottlenecks vs customer reviews &#183; Interactive Tableau Dashboard</text>
    </g>

    <!-- Minimalist Tech Stack Pills -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: DuckDB -->
      <rect x="0" y="0" width="80" height="22" rx="3" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="40" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#00f0ff">DuckDB</text>

      <!-- Pill 2: Tableau -->
      <rect x="88" y="0" width="80" height="22" rx="3" fill="#ffb703" fill-opacity="0.08" stroke="#ffb703" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="128" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#ffb703">Tableau</text>

      <!-- Pill 3: PyTorch -->
      <rect x="176" y="0" width="80" height="22" rx="3" fill="#00f5d4" fill-opacity="0.08" stroke="#00f5d4" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="216" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#00f5d4">PyTorch</text>

      <!-- Pill 4: LangGraph -->
      <rect x="264" y="0" width="92" height="22" rx="3" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="310" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#a78bfa">LangGraph</text>

      <!-- Pill 5: SQL -->
      <rect x="364" y="0" width="60" height="22" rx="3" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="394" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#38bdf8">SQL</text>

      <!-- Pill 6: Amazon ML '25 -->
      <rect x="432" y="0" width="130" height="22" rx="3" fill="#ff0055" fill-opacity="0.08" stroke="#ff0055" stroke-width="0.8" stroke-opacity="0.5"/>
      <text x="497" y="15" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#ff6b8b">AMAZON ML '25</text>
    </g>

    <!-- Bottom Status Note -->
    <text x="0" y="204" class="mono" font-size="8.5" fill="#475569">
      // PHILOSOPHY: SHIP REAL THINGS &#183; EVIDENCE OVER PROMISES &#183; OPEN TO COLLABORATION
    </text>
  </g>
</svg>