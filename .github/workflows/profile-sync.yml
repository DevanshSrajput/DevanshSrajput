name: Sync GitHub Profile 3D City & Telemetry

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/stats.svg'
      - 'assets/streak.svg'
      - 'profile-3d-contrib/**'

permissions:
  contents: write

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    name: sync-3d-city-and-telemetry
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate 3D Profile Contribution Skyline
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Glassmorphism Stats & Streaks with Live Data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_telemetry.py

      - name: Commit & Push Updated Profile Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/streak.svg profile-3d-contrib/
          if git diff --staged --quiet; then
            echo "No asset changes to commit"
          else
            git commit -m "chore(profile): auto-sync 3d skyline, glassmorphic stats, and streaks [skip ci]"
            git push
          fi
