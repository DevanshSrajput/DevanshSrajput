name: Update Live GitHub Glass Stats

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'assets/stats.svg'
      - 'scripts/stats_data.json'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    name: fetch-and-generate-stats
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Glassmorphism Stats SVG with Live GitHub Data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_stats_svg.py

      - name: Commit & Push updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          if git diff --staged --quiet; then
            echo "No stats changes to commit"
          else
            git commit -m "chore(telemetry): update real-time github glassmorphism stats"
            git push
          fi
